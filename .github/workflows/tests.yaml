---
name: tests

defaults:
  run:
    shell: bash

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build-bins:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'core-e2e' }}
    steps:
      - name: Cleanup build folder
        run: |
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true
          sudo rm -rf "$HOME/go/pkg/mod" || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: make build
      - run: make provider-services
      - run: make docker-image

  tests:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","akash"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Preserve annotated tags when checkout fetches the full history.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || '' }}
          fetch-depth: 0
      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu
      - run: make test-full
      - name: Check workload recovery across provider upgrades
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          RECOVERY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash script/test-provider-recovery-upgrade.sh "$RECOVERY_BASE_REF"

  lint:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","akash"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu
      - name: Run linter
        run: make lint

      - name: Reject lint findings introduced by this source
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$LINT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$LINT_BASE_SHA^{commit}"
          .cache/bin/golangci-lint run ./... --new-from-rev="$LINT_BASE_SHA" --issues-exit-code=1 --timeout=20m

  release-dry-run:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'core-e2e' }}
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Cleanup build folder
        run: |
          sudo rm -rf ./* || true
          sudo rm -rf ./.??* || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2
      - name: configure git tag
        run: echo "RELEASE_TAG=v$(./script/semver.sh bump patch "$(git describe --tags --abbrev=0)")" >> "$GITHUB_ENV"
      - name: git tag
        run: git tag -a ${{ env.RELEASE_TAG }} -m ${{ env.RELEASE_TAG }}
      - name: release dry-run
        run: make release

  coverage:
    needs: integration-tests
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","akash"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu
      - name: Download this exact attempt's complete integration coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: provider-complete-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/tests
      - name: Verify original coverage input and source
        run: |
          test -s .cache/tests/coverage.txt
          test "$(head -n 1 .cache/tests/coverage.txt)" = 'mode: atomic'
          test "$(cat .cache/tests/coverage-source.txt)" = "$GITHUB_SHA"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: .cache/tests/coverage.txt

  yamlcheck:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","akash"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: check-yml-count
        run: |
          if [[ $(git ls-files '*.yml' ':!:.codecov.yml' | wc -l) -ne 0 ]]; then git ls-files '*.yml' ':!:.codecov.yml' && exit 1;fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup environment
        uses: ./.github/actions/setup-ubuntu
      - run: make shellcheck

  integration-tests:
    uses: ./.github/workflows/integration-tests.yaml

  dispatch-release:
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags/v')
    needs:
      - build-bins
      - tests
      - lint
      - release-dry-run
      - coverage
      - yamlcheck
      - shellcheck
      - integration-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: trigger release process
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1
        with:
          workflow: release.yaml
