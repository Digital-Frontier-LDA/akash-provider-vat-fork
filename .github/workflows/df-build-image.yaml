name: df-build-image

# One-off: build the forked provider image (with the df-telemetry hook) for amd64
# on a GitHub-hosted runner and push to GHCR. The canonical `release` workflow needs a
# self-hosted `core-e2e` runner + a tag; this reuses the fork's own `make docker-image`
# (goreleaser snapshot, handles wasmvm/musl/CGO) so no self-hosted runner is required.
on:
  push:
    branches: [df-build-image]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Version stamped into version.Version (e.g. v0.14.2-df.1). Without it,
          Make falls back to `git describe --tags --abbrev=0`, which resolves the
          df-base/* ref through upstream's embedded tag name and emits the long
          v0.14.0-21-g<full-sha> form that Akash Console then displays verbatim.
        required: true
        type: string

# One build per release tag at a time, QUEUED, never cancelled. Without it two dispatches
# with the same new tag could both pass the "refuse to reuse" check below before either
# pushes, and the second push would move the tag (akash-providers-IaC#233). Queued, the
# second run checks only after the first has pushed, and stops.
concurrency:
  group: df-build-image-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

# Default every job to read-only; the build job re-declares what it actually
# needs. Without a top-level block the default for jobs that don't declare one
# is the repo-wide setting, which is not necessarily read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # pushes the fork image to GHCR
    env:
      RELEASE_DOCKER_IMAGE: ghcr.io/digital-frontier-lda/akash-provider-vat-fork
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Free ~25-30GB on the hosted runner. The goreleaser-cross build compiles
      # multiple targets (linux amd64+arm64 + debug variants) and v0.14.0's larger
      # dependency tree overflows the default ~14GB disk ("no space left on device"
      # in /tmp/go-build). Remove preinstalled SDKs we don't use before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
            /usr/local/lib/node_modules /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /
      # Canonical fork setup: installs direnv + loads .envrc (AKASH_DIRENV_SET) + Go.
      - uses: ./.github/actions/setup-ubuntu
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release tag names exactly one build. v0.16.2-df.1 was pushed twice, onto two
      # different images, so two clusters ran a digest whose name had moved and both
      # builds reported the same version to Console (akash-providers-IaC#233). Checked
      # BEFORE the build so a reused tag costs seconds, not a full goreleaser run. Only
      # "manifest unknown" counts as free: any other failure to look stops the build,
      # because a guard that cannot see must not pass.
      - name: Refuse to reuse an existing release tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          [ -n "$RELEASE_TAG_INPUT" ] || exit 0
          ref="ghcr.io/digital-frontier-lda/akash-provider-vat-fork:${RELEASE_TAG_INPUT}-amd64"
          if out=$(docker manifest inspect "$ref" 2>&1); then
            echo "::error::$ref already exists. Bump df.N; never move a release tag onto a new build (akash-providers-IaC#233)."
            exit 1
          fi
          case "$out" in
            *"manifest unknown"*) echo "$ref is free" ;;
            *) echo "::error::could not tell whether $ref exists: $out"; exit 1 ;;
          esac
      - name: Build provider image (snapshot)
        # release_tag reaches the shell via env, not ${{ }} interpolation in run:
        # (zizmor/CodeRabbit template-injection rule — a crafted input could
        # otherwise inject shell into the runner).
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          make docker-image \
            RELEASE_DOCKER_IMAGE=ghcr.io/digital-frontier-lda/akash-provider-vat-fork \
            ${RELEASE_TAG_INPUT:+RELEASE_TAG="$RELEASE_TAG_INPUT"}
      - name: Push amd64 image
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          docker images
          docker push ghcr.io/digital-frontier-lda/akash-provider-vat-fork:latest-amd64
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            docker tag ghcr.io/digital-frontier-lda/akash-provider-vat-fork:latest-amd64 \
              "ghcr.io/digital-frontier-lda/akash-provider-vat-fork:${RELEASE_TAG_INPUT}-amd64"
            docker push "ghcr.io/digital-frontier-lda/akash-provider-vat-fork:${RELEASE_TAG_INPUT}-amd64"
          fi
          echo "== pushed digest (pin this in helm values) =="
          docker inspect --format='{{index .RepoDigests 0}}' \
            ghcr.io/digital-frontier-lda/akash-provider-vat-fork:latest-amd64
